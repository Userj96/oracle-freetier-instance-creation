name: OCI Capacity Hunter

on:
  workflow_dispatch:
  schedule:
    # Deliberately not on :00 to avoid concentrating with other hourly jobs.
    # GitHub may still delay scheduled workflows under platform load.
    - cron: '50 * * * *'

concurrency:
  group: oci-instance-hunter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 54
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare OCI credentials and environment
        shell: bash
        env:
          OCI_CONFIG_SECRET: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY_SECRET: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_ENV_SECRET: ${{ secrets.OCI_ENV }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CONFIG_SECRET" > oci_config
          printf '%s\n' "$OCI_API_PRIVATE_KEY_SECRET" > oci_api_private_key.pem
          printf '%s\n' "$OCI_ENV_SECRET" > oci.env
          python - <<'PY'
          from pathlib import Path
          p = Path("oci.env")
          lines = p.read_text(encoding="utf-8").splitlines()
          out = []
          found_key = False
          for line in lines:
              if line.startswith("OCI_CONFIG="):
                  out.append("OCI_CONFIG=" + str(Path.cwd() / "oci_config"))
              elif line.startswith("SSH_AUTHORIZED_KEYS_FILE="):
                  # The Actions runner must never generate the VM's private SSH key.
                  # The persistent public key is supplied through SSH_AUTHORIZED_KEYS.
                  out.append("SSH_AUTHORIZED_KEYS_FILE=")
              elif line.startswith("SSH_AUTHORIZED_KEYS="):
                  found_key = True
                  out.append(line)
              else:
                  out.append(line)
          if not found_key:
              raise SystemExit("OCI_ENV must contain SSH_AUTHORIZED_KEYS=<your local VM public key>")
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          cp oci_config "$HOME/.oci/config"
          cp oci_api_private_key.pem "$HOME/.oci/oci_api_private_key.pem"
          chmod 600 oci_config oci_api_private_key.pem "$HOME/.oci/config" "$HOME/.oci/oci_api_private_key.pem"

      - name: Run OCI capacity hunter
        run: python main.py

      - name: Upload hunter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-hunter-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            launch_instance.log
            setup_and_info.log
            images_list.json
            INSTANCE_CREATED
            ERROR_IN_CONFIG.log
            UNHANDLED_ERROR.log
            python_error.log
